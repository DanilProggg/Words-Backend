version: "3.8"

services:
  gateway:
    build:
      context: .
      dockerfile: gateway.Dockerfile
    ports:
      - "8090:8090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://users-db:5432/users-db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: srvadmin
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: user
    depends_on:
      - users-db
      - rabbitmq

  memorization:
    build:
      context: .
      dockerfile: memorization.Dockerfile
    ports:
      - "9091:9091"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://memorization-db:5432/memorization
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: srvadmin
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: user
    depends_on:
      - memorization-db
      - rabbitmq

  users-db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: srvadmin
      POSTGRES_DB: users-db
    ports:
      - "54321:5432"
    volumes:
      - users-db-data:/var/lib/postgresql/data

  memorization-db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: srvadmin
      POSTGRES_DB: memorization
    ports:
      - "54322:5432"
    volumes:
      - memorization-db-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: user
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  users-db-data:
  memorization-db-data:
